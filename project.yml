name: Pagefold
options:
  bundleIdPrefix: com.integra4d
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Config/Local.xcconfig лежит в .gitignore: без него генерация не должна падать.
  disabledValidations:
    - missingConfigFiles
targets:
  Pagefold:
    type: application
    platform: iOS
    sources:
      - Pagefold
    info:
      path: Pagefold/Info.plist
      properties:
        CFBundleDisplayName: Pagefold
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы диктовать запросы ИИ-помощнику голосом.
        NSSpeechRecognitionUsageDescription: Распознавание речи переводит вашу диктовку в текст запроса.
    # Team ID держим локально (Config/Local.xcconfig из .example), а не в репозитории.
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.integra4d.pagefold
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Pagefold/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
